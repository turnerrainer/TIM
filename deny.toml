# cargo-deny configuration.
#
# Complements cargo-audit (see .cargo/audit.toml) with three checks
# audit does not cover:
#
#   1. licenses  — every dep's license is in the allow-list below
#   2. bans      — no wildcards, warn on duplicate versions
#   3. sources   — every crate comes from crates.io (no unvetted git URLs)
#
# Enforced in CI via .github/workflows/security.yml.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "deny"
# Mirrors .cargo/audit.toml [advisories.ignore]. Rationale +
# review date live there.
ignore = [
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
