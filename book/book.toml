[book]
title = "TIM-on-Rust"
authors = ["Rainer Türner"]
description = "Reference for operators and API consumers of TIM-on-Rust — Token Identity Manager."
language = "en"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "light"
git-repository-url = "https://github.com/turnerrainer/TIM"
edit-url-template = "https://github.com/turnerrainer/TIM/edit/dev/book/{path}"
site-url = "/TIM/"

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1

[output.html.playground]
runnable = false

# Doc tests: mdbook-linkcheck fails the build on broken internal
# links (chapter-to-chapter). External URLs are skipped —
# `follow-web-links = false` — since CI would flake on rate-limited
# responses from github.com etc. Internal breakage is what matters.
[output.linkcheck]
follow-web-links = false
warning-policy = "error"
