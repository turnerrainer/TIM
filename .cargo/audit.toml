# cargo-audit configuration.
#
# Advisory IDs listed under `ignore` are downgraded to soft warnings
# so `cargo audit --deny warnings` still passes. Every entry MUST
# carry a rationale and a review date; unreviewed entries are a
# code smell. Any entry added here MUST also be mirrored in
# deny.toml [advisories.ignore].

[advisories]
ignore = [
    # `rsa` — Marvin Attack (timing side-channel on RSA decryption).
    # TIM does NOT use `rsa` for signing or decryption. The crate is
    # pulled in only to parse a PKCS#8 PEM private key at startup
    # (`RsaPrivateKey::from_pkcs8_pem`), derive the public key
    # (`RsaPublicKey::from(&private)`, `.n()`, `.e()`), and re-emit
    # the public half as PKCS#1 PEM. All actual JWT sign / verify
    # operations go through `jsonwebtoken`, which uses `ring`
    # internally — the Marvin Attack surface is not reachable from
    # any TIM code path. Re-audit if TIM ever gains a code path
    # that calls `RsaPrivateKey::decrypt` or similar.
    # Session-at-rest encryption uses ChaCha20-Poly1305 AEAD
    # (`src/oauth2/session/crypto.rs`), not RSA.
    # Reviewed: 2026-09-18. Next review: 2027-03-18.
    "RUSTSEC-2023-0071",

    # `unsafe-libyaml` — upstream repository archived 2024-03-25.
    # Unmaintained, not a vulnerability — no known exploitable CVE.
    # Pulled in only as a transitive dep of `serde_yaml_ng` (the
    # single consumer), used by `src/config/mod.rs` to parse the
    # operator-supplied YAML config file at startup. Input is a
    # local file controlled by the operator, not reachable from
    # the network, so the attack surface for a YAML parser bug is
    # effectively nil in TIM's threat model. Migration away from
    # serde_yaml_ng (candidates: serde-saphyr, noyalib) is tracked
    # as a follow-up; it's a non-trivial API swap not worth
    # blocking CI on while there's no concrete vuln.
    # Reviewed: 2026-10-14. Next review: 2027-04-14.
    "RUSTSEC-2024-0449",

    # `libsqlite3-sys` 0.30.1 — bundled C SQLite uninitialised-memory
    # disclosure (CVE-2026-119375, WAL, local attack vector).
    # NOT compiled into TIM. The crate sits in Cargo.lock only because
    # `sqlx-macros-core` declares `sqlx-sqlite` as an *optional*
    # dependency and Cargo resolves optional deps into the lockfile
    # even when the feature is off. TIM enables only sqlx's `postgres`
    # driver (default-features = false), so
    #   cargo tree -i libsqlite3-sys --target all --all-features -e all
    # prints "nothing to print": no sqlite code is built or linked,
    # and TIM never opens a SQLite database.
    # Cannot be fixed by upgrading: the fix is libsqlite3-sys >=0.39.0
    # but sqlx-sqlite 0.8.6 pins ^0.30.1 and sqlx-sqlite 0.9.0 caps
    # <0.38, so no released sqlx can resolve a patched version.
    # Re-check when a sqlx release allows libsqlite3-sys >=0.39, and
    # immediately if TIM ever enables the sqlx `sqlite` feature.
    # Reviewed: 2026-11-13. Next review: 2027-02-13.
    "RUSTSEC-2026-0459",
]
