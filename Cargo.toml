[package]
name = "tim"
version = "0.4.1-alpha"
edition = "2021"
rust-version = "1.88"
authors = ["Rainer Türner"]
license = "Apache-2.0"
description = "TIM — Token Identity Manager. Rust implementation. Custom JWT lifecycle + OAuth2/OIDC multi-provider auth + RFC 7662 introspection."
repository = "https://github.com/turnerrainer/TIM"

[dependencies]
# Web framework + async runtime
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "limit", "timeout", "cors", "set-header"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
serde_urlencoded = "0.7"

# HTTP client (native-tls for broad TLS compatibility with upstream OIDC providers)
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

# Database (PostgreSQL, async, no ORM)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-native-tls", "postgres", "uuid", "chrono", "macros", "migrate"] }

# JWT + crypto
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["pem", "sha2"] }
sha2 = "0.10"
base64 = "0.22"
# AEAD for at-rest encryption of session token material.
chacha20poly1305 = "0.10"
# Constant-time comparison for admin-token check.
subtle = "2"

# Concurrency primitives
dashmap = "6"

# Caching (OIDC discovery + JWKS)
moka = { version = "0.12", features = ["future"] }

# Common
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
rand = "0.8"

# async trait objects for the SessionStore trait
async-trait = "0.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "2"
anyhow = "1"

# CLI arg parsing
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
mockito = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# T-15 slow-body probe needs a Stream impl to feed axum::body::Body.
futures-core = "0.3"

[[bin]]
name = "tim"
path = "src/main.rs"

# Clippy posture — matches Ruuter-on-Rust + XTR + DEV-REQUIREMENTS §2.
# `cargo clippy --all-targets -- -D warnings` is the CI gate.
[lints.clippy]
# `#[async_trait]` expands to a boxed-future return type that is
# already `#[must_use]`, then layers its own `#[must_use]` attribute
# on top. Rust 1.99.0's `clippy::double_must_use` lint flags each
# `async fn` inside an `#[async_trait]`-decorated trait as an error
# under `-D warnings`. The offending `#[must_use]` lives inside the
# macro expansion of a third-party crate (`async-trait`), not our
# source. Allowing the lint is the only fix that doesn't require
# forking `async-trait`. Revisit if TIM migrates to native
# async-fn-in-traits.
double_must_use = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
